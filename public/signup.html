<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sign Up - Blog App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page font-inter bg-gray-50 min-h-screen">
    <!-- main container -->
    <div class="flex min-h-screen items-center justify-center px-4 py-8">
        <!-- signup card -->
        <div class="relative w-full max-w-md rounded-2xl bg-white p-8 sm:p-10 shadow-sm border border-gray-200/80">
            <!-- header -->
            <div class="mb-6 text-center">
                <p class="brand-mark">Blog-App</p>
                <h2 class="text-3xl font-bold text-gray-900">Sign Up</h2>
                <p class="auth-subtitle">A space for stories and conversation.</p>
            </div>

            <!-- OR divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white px-3 text-gray-400 font-medium tracking-wider">OR</span>
                </div>
            </div>
        
            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700">Username</label>
                    <input class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 transition-colors duration-200 focus:border-gray-900 focus:outline-none" type="text" id="username" autocomplete="username" name="username" placeholder="Your Username" required />
                </div>

                <div class="mb-6">
                    <label for="password" class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700">Password</label>
                    <div class="relative">
                        <input class="w-full border border-gray-200 rounded-xl px-4 py-2.5 pr-11 text-sm text-gray-900 placeholder-gray-400 transition-colors duration-200 focus:border-gray-900 focus:outline-none" type="password" id="password" autocomplete="new-password" name="password" placeholder="••••••••••••" required />
                        <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1 focus:outline-none" aria-label="Toggle password visibility">
                            <svg class="eye-icon w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <svg class="eye-off-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                        </button>
                    </div>
                </div>

                <div class="mb-6">
                    <button class="w-full cursor-pointer rounded-xl bg-[#262626] hover:bg-black text-white py-3 text-sm font-semibold tracking-wide transition-all duration-200 shadow-sm" type="submit">Sign Up</button>
                </div>

                <div class="text-center text-xs sm:text-sm text-gray-600">
                    Already have an account?
                    <a href="index.html" class="font-bold text-gray-900 hover:underline">Sign in</a>
                </div>
            </form>

        </div>
    </div>

    <script src="js/util.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
