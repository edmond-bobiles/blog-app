<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page font-inter">
    <!-- main container -->
    <div class="flex min-h-screen items-center justify-center px-2">
        <!-- login card -->
        <div class="relative w-full max-w-md rounded-xl bg-white p-8 shadow-sm border border-gray-200/80">
            <!-- login form -->
            <div class="mb-6 text-center">
                <p class="brand-mark">Blog-App</p>
                <h2 class="text-3xl font-bold text-gray-900">Login</h2>
                <p class="auth-subtitle">A space for stories and conversation.</p>
            </div>
        
            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="mb-2 block text-sm font-medium text-gray-700">Username</label>
                    <input class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm transition-colors duration-200 focus:border-blue-500 focus:outline-none" type="text" id="username" autocomplete="username" name="username" placeholder="Enter your username" required />
                </div>

                <div class="mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <a href="forgotPassword.html" class="text-xs font-medium text-blue-600 hover:text-blue-700 hover:underline">Forgot password?</a>
                    </div>
                    <input class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm transition-colors duration-200 focus:border-blue-500 focus:outline-none" type="password" id="password" autocomplete="current-password" name="password" placeholder="Enter your password" required />
                </div>

                <div class="mb-6">
                    <button class="w-full cursor-pointer rounded-lg bg-blue-600 py-2.5 text-sm font-semibold tracking-wide text-white transition-all duration-200 hover:bg-blue-700 shadow-sm hover:shadow" type="submit">Log In</button>
                </div>

                <div class="text-center text-sm text-gray-500">
                    Don't have an account?
                    <a href="signup.html" class="text-blue-600 font-medium hover:text-blue-700 hover:underline transition-colors duration-200">Sign Up</a>
                </div>
            </form>

        </div>
    </div>

    <script src="js/util.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
