<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Posts - Blog App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-inter bg-gray-50 min-h-screen">
    <!-- navbar -->
    <nav class="bg-gray-800 shadow-lg">
        <div class="px-8">
            <div class="flex justify-between items-center py-3">
                <!-- left navbar-->
                <a class="text-white text-xl font-bold hover:text-gray-300 transition-colors duration-200" href="viewPosts.html">Blog-App</a>
                
                <!-- hamburger menu button for mobile -->
                <button 
                    id="mobile-menu-button" 
                    class="md:hidden text-white hover:text-gray-300 focus:outline-none focus:text-gray-300"
                    type="button">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- right navbar for desktop -->
                <div class="hidden md:flex space-x-8">
                    <a href="viewPosts.html"
                    class="text-white bg-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                    Home</a>
                    <a href="createPost.html"
                    class="text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition-colors duration-200">
                    Create Post</a>
                    <a href="#" class="logoutLink text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition-colors duration-200">
                    Logout</a>
                </div>
            </div>
            
            <!-- hamburger menu items for mobile -->
            <div id="mobile-menu" class="md:hidden hidden">
                <div class="px-2 pt-2 pb-3 space-y-1 border-t border-gray-700">
                    <a href="viewPosts.html" 
                    class="text-white bg-gray-900 block px-3 py-2 rounded-md text-base font-medium">
                    Home</a>
                    <a href="createPost.html" class="text-gray-300 hover:text-white block px-3 py-2 text-base font-medium transition-colors duration-200">
                    Create Post</a>
                    <a class="logoutLink text-gray-300 hover:text-white block px-3 py-2 text-base font-medium transition-colors duration-200">
                    Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- main content -->
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Posts</h1>
        </div>

        <!-- posts container -->
        <div id="posts-container" class="space-y-6">
            <!-- no posts state -->
            <div id="no-posts" class="hidden text-center py-12">
                <h3 class="text-xl font-semibold text-gray-700 mb-2">No posts yet</h3>
                <p class="text-gray-500 mb-4">No posts have been made yet</p>
                <a href="createPost.html" 
                class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                Create your post
                </a>
            </div>
        </div>
    </div>

    <script src="js/util.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/comments.js" defer></script>
    <script src="js/posts.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/auth.js" defer></script>  
</body>
</html>
