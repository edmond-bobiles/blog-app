<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Posts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-inter">
<!-- navbar -->
    <nav class="bg-gray-800 shadow-lg">
        <div class="px-8">
            <div class="flex justify-between items-center py-3">
                <!-- left navbar-->
                <a class="text-white text-xl font-bold hover:text-gray-300 transition-colors duration-200" href="viewPosts.html">Blog-App</a>
                
                <!-- hamburger menu button for mobile -->
                <button 
                    id="mobile-menu-button" 
                    class="md:hidden text-white hover:text-gray-300 focus:outline-none focus:text-gray-300"
                    type="button">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- right navbar for desktop -->
                <div class="hidden md:flex space-x-8">
                    <a href="viewPosts.html" 
                    class="text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition-colors duration-200">
                    Home</a>
                    <a href="createPost.html" class="text-white bg-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                    Create Post</a>
                    <a href="#" class=" logoutLink text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition-colors duration-200">
                    Logout</a>
                </div>
            </div>
            
            <!-- hamburger menu items for mobile -->
            <div id="mobile-menu" class="md:hidden hidden">
                <div class="px-2 pt-2 pb-3 space-y-1 border-t border-gray-700">
                    <a href="viewPosts.html" class="text-gray-300 hover:text-white block px-3 py-2 text-base font-medium transition-colors duration-200">
                    Home</a>
                    <a href="createPost.html" class="text-white bg-gray-900 block px-3 py-2 rounded-md text-base font-medium">
                    Create Post</a>
                    <a href="#" class="logoutLink text-gray-300 hover:text-white block px-3 py-2 text-base font-medium transition-colors duration-200">
                    Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- post form creation -->
    <div class="max-w-4xl mx-auto mt-8 px-4">
        <div class="bg-white rounded-lg shadow-md">
            <!-- form header -->
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-2xl font-semibold text-gray-900">Create New Post</h3>
            </div>
            
            <!-- form body -->
            <div class="p-6">
                <form id="createPostForm" class="space-y-6">
                    <!-- title field -->
                    <div>
                        <label for="postTitle" class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                        <input type="text" id="postTitle" name="title" required placeholder="Enter post title"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                    </div>
                    
                    <!-- description field -->
                    <div>
                        <label for="postDescription" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea id="postDescription" name="description" rows="6" required placeholder="Enter post description" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-vertical"></textarea>
                    </div>
                    
                    <!-- create post button -->
                    <div class="flex flex-col sm:flex-row gap-3 sm:justify-end">
                        <button type="submit"
                        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        Create Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script> <!-- existing global handlers -->
    <script src="js/createPost.js"></script>
</body>
</html>
