<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white-">
    <!-- main container -->
    <div class="flex min-h-screen items-center justify-center px-2">
        <!-- login card -->
        <div class="relative w-full max-w-md rounded-xl bg-white p-8 shadow-lg">
            <!-- login form -->
            <div class="mb-6 text-center">
                <h2 class="text-3xl font-bold text-black">Sign Up</h2>
            </div>
        
            <form id="loginForm">
                <div class="mb-4">
                    <label class="mb-2 block text-sm font-medium text-gray-600">Enter Your Username</label>
                    <input class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 text-base transition-colors duration-300 focus:border-blue-500 focus:outline-none" type="text" name="username" required />
                </div>

                <div class="mb-6">
                    <label class="mb-2 block text-sm font-medium text-gray-600">Enter Your Password</label>
                    <input class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 text-base transition-colors duration-300 focus:border-blue-500 focus:outline-none" type="password" name="password" required />
                </div>

                <div class="mb-6">
                    <button class="w-full cursor-pointer rounded-lg bg-blue-600 py-3.5 text-base font-semibold tracking-wider text-white uppercase transition-colors duration-200 hover:bg-blue-700" type="submit">Sign Up</button>
                </div>

                <div class="text-center text-sm text-gray-600">
                    Already have an account?
                    <a href="index.html" class="text-cyan-400 no-underline transition-colors duration-200 hover:text-cyan-500">Sign In</a>
                </div>
            </form>

        </div>
    </div>

    <script src="js/util.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
