<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Posts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-inter">
    <!-- navbar -->
    <nav class="bg-gray-800 shadow-lg">
        <div class="px-8">
            <div class="flex justify-between items-center py-3">
                <!-- left navbar-->
                <a class="text-white text-xl font-bold hover:text-gray-300 transition-colors duration-200" href="viewPosts.html">Blog-App</a>
                
                <!-- hamburger menu button for mobile -->
                <button 
                    id="mobile-menu-button" 
                    class="md:hidden text-white hover:text-gray-300 focus:outline-none focus:text-gray-300"
                    type="button">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                 <!-- right navbar for desktop -->
                <div class="hidden md:flex space-x-8">
                    <a href="viewPosts.html" 
                    class="text-white bg-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                    Home</a>
                    <a href="createPost.html" 
                    class="text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition-colors duration-200">
                    Create Post</a>
                    <a id="logoutLink" href="#" 
                    class="text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition-colors duration-200">
                    Logout</a>
                </div>
            </div>
            
            <!-- hamburger menu items for mobile -->
            <div id="mobile-menu" class="md:hidden hidden">
                <div class="px-2 pt-2 pb-3 space-y-1 border-t border-gray-700">
                    <a href="viewPosts.html" 
                    class="text-white bg-gray-900 block px-3 py-2 rounded-md text-base font-medium">
                    Home</a>
                    <a href="createPost.html" 
                    class="text-gray-300 hover:text-white block px-3 py-2 text-base font-medium transition-colors duration-200">
                    Create Post</a>
                    <a id="logoutLink" href="#" 
                    class="text-gray-300 hover:text-white block px-3 py-2 text-base font-medium transition-colors duration-200">
                    Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Demo content -->
    <div class="container mx-auto px-4 mt-8 max-w-6xl">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">Welcome to Blog-App</h1>
        <p class="text-gray-600 text-lg leading-relaxed">This is a demo page to showcase the navbar. The navbar is responsive and will collapse on smaller screens.</p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
